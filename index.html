<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Henriques Garcia — Windows Desktop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="desktop" class="desktop" aria-label="Windows XP desktop">
        <div id="desktopIcons" class="desktop-icons" aria-label="Desktop icons"></div>
        <section id="windowLayer" class="window-layer" aria-live="polite"></section>
        <div id="startMenu" class="start-menu" hidden></div>
    </main>

    <footer class="taskbar" aria-label="Windows taskbar">
        <button id="startButton" class="start-button" type="button" aria-expanded="false">
            <span class="windows-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <strong>start</strong>
        </button>
        <div id="taskbarWindows" class="taskbar-windows" aria-label="Open windows"></div>
        <div class="taskbar-languages" aria-label="Language selection">
            <button class="lang-btn active" type="button" data-language="en">EN</button>
            <button class="lang-btn" type="button" data-language="pt">PT</button>
            <button class="lang-btn" type="button" data-language="nl">NL</button>
        </div>
        <div class="system-tray">
            <span aria-hidden="true">◈</span>
            <span aria-hidden="true">🔊</span>
            <time id="taskbarClock">12:00</time>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="windowManager.js"></script>
    <script src="caseStudy.js"></script>
    <script src="explorer.js"></script>
    <script src="apps.js"></script>
    <script src="contact.js"></script>
    <script src="startMenu.js"></script>
    <script src="desktop.js"></script>
</body>
</html>
